# Mga setting para sa pamamahala at pag-configure ng Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Kinakailangan: Ang bersyon ng spec. Huwag baguhin.
specVersion: v1alpha1

# Opsyonal: I-configure ang environment variables para sa iyong runConfig.
# Ang mga sikreto ay ligtas na iniimbak sa Google Secret Manager.
env:
  - variable: GEMINI_API_KEY
    secret: lingkod-ani-gemini-key

runConfig:
  # Opsyonal: Taasan ang halagang ito para awtomatikong mag-spin up
  # ng mas maraming instance bilang tugon sa tumataas na trapiko.
  maxInstances: 1
