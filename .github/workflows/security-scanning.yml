name: Security Scanning & Monitoring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm Audit Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Generate SBOM (Software Bill of Materials)
        run: npm sbom --sbom-format cyclonedx --sbom-output sbom.cyclonedx.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.cyclonedx.json

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json
        continue-on-error: true

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-report.sarif
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: lingkod-ani
          path: .
          format: SARIF
          args: >
            --enable-npm
            --enable-javascript
            --suppress ./dependency-check-suppression.xml
        continue-on-error: true

      - name: Upload Dependency Check results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  code-quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck
        continue-on-error: false

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run unit tests
        run: npm test -- --coverage --json --outputFile=coverage.json
        continue-on-error: false

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build-check:
    name: Production Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        continue-on-error: false

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed: .next directory not created"
            exit 1
          fi
          echo "✓ Build successful"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [npm-audit, snyk-scan, dependency-check, code-quality, build-check]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create security report
        run: |
          cat > SECURITY_REPORT.md << 'EOF'
          # Security Scan Report
          
          **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow**: ${{ github.workflow }}
          **Commit**: ${{ github.sha }}
          
          ## Status Summary
          - npm Audit: ${{ job.status }}
          - Snyk Scan: ${{ job.status }}
          - OWASP Dependency Check: ${{ job.status }}
          - Code Quality: ${{ job.status }}
          - Build Check: ${{ job.status }}
          
          See individual job results in GitHub Actions for details.
          EOF
          cat SECURITY_REPORT.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: SECURITY_REPORT.md
